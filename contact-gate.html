<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Contact | CareerSteps</title>

<meta name="description"
content="Unlock the Contact Page by dragging the hanging lamp.">

<link rel="stylesheet" href="css/contact-gate.css">

</head>

<body>

<!-- Aurora Background -->
<div class="aurora aurora-left"></div>
<div class="aurora aurora-right"></div>

<!-- Main -->
<main class="gate">

    <!-- Logo -->
    <img
    src="careersteps-logo.png"
    class="logo"
    alt="CareerSteps">

    <!-- Title -->
    <h1>
        Drag the Lamp
    </h1>

    <p>
        Pull the hanging lamp to unlock the
        CareerSteps Contact Page.
    </p>

    <!-- Lamp Area -->

    <section class="lamp-wrapper">

        <!-- Rope -->

        <div
        class="lamp-rope"
        id="lampRope">
        </div>

        <!-- Lamp -->

        <div
        class="lamp-container"
        id="lamp">

            <div class="lamp-head"></div>

            <div class="lamp-body"></div>

            <div class="lamp-glass"></div>

        </div>

        <!-- Light -->

        <div
        class="light-cone"
        id="lightCone">
        </div>

    </section>

    <!-- Hint -->

    <div class="hint">

        ← Drag Left or Right →

    </div>

</main>

<!-- Loader -->

<div
id="loaderScreen"
class="loader-screen">

<div class="loader-circle"></div>

<h2>

Opening Contact Page...

</h2>

</div>

<script src="js/contact-gate.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Contact | CareerSteps</title>

<meta name="description"
content="Unlock the Contact Page by dragging the hanging lamp.">

<link rel="stylesheet" href="css/contact-gate.css">

</head>

<body>

<!-- Stars -->
<div class="stars"></div>

<!-- Ambient Glow -->
<div class="ambient-glow"></div>

<!-- Unlock Flash -->
<div id="unlockFlash"></div>

<!-- Access Granted -->
<div id="accessGranted">
    <div class="tick">✓</div>
    <h2>ACCESS GRANTED</h2>
    <p>Opening Contact Page...</p>
</div>
    
<!-- Aurora Background -->
<div class="aurora aurora-left"></div>
<div class="aurora aurora-right"></div>

<!-- Main -->
<main class="gate">

    <!-- Logo -->
    <img
    src="careersteps-logo.png"
    class="logo"
    alt="CareerSteps">

    <!-- Title -->
    <h1>
        Drag the Lamp
    </h1>

    <p>
        Pull the hanging lamp to unlock the
        CareerSteps Contact Page.
    </p>

    <!-- Lamp Area -->

    <section class="lamp-wrapper">

        <!-- Rope -->

        <div
        class="lamp-rope"
        id="lampRope">
        </div>

        <!-- Lamp -->

    <div
class="lamp-container"
id="lamp">

    <div class="lamp-head"></div>

    <div class="lamp-body"></div>

    <div class="lamp-glass"></div>

    <div class="lamp-highlight"></div>

    <div class="lamp-core"></div>

</div>

        <!-- Light -->

        <div
        class="light-cone"
        id="lightCone">
        </div>

        <div class="light-rays">
    <span></span>
    <span></span>
    <span></span>
</div>
        
        <!-- Floating Particles -->
<div class="particles">
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
</div>
        
    </section>

    <!-- Hint -->
<div class="hint">

🖱 Drag the hanging lamp

<br>

<span>Unlock CareerSteps Contact Page</span>

</div>
    
</main>

<!-- Loader -->

<div
id="loaderScreen"
class="loader-screen">

<div class="loader-circle"></div>

<h2>
Unlocking CareerSteps...
</h2>

<p style="margin-top:10px;color:#9ca3af;">
Preparing your contact page...
</p>

</div>

<script src="js/contact-gate.js"></script>

</body>
</html>
